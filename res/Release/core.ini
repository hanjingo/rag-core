[log]
min_lvl=0
flush_on=0
filename=log/core.log
max_size=2
max_files=10

[sync]
write_queue_size=1024
thread_pool_size=4

[server]
addr=127.0.0.1:50051
publish_addr=tcp://localhost:50050

[client]
clients=configs/client.ini

[db]
sqlite=sqlite1

[sqlite1]
id=0
path=configs/core.db
capa=10
min_sz=5

[param]
query_limit=1000

[issuer]
id=hehehunanchina@live.com
algo=0
pri_key=
encrypted_pri_key=
valid_times=10000000
expired_days=30

[verifier]
id=hehehunanchina@live.com
algo=0
pub_key=
encrypted_pub_key=

[asr]
audio_buffer_size = 1600000
audio_min_chunk_size = 48000
audio_wait_chunk_timeout_ms = 4500
models = configs/asr.ini

[llm]
ctx_window_sz = 4096
num_threads = 1
max_repeats = 7
local_prompt_threshold = 50
models = configs/models.ini
remote_apis = configs/remote_apis.ini
embedding_model = ggml/bge-small-en-v1.5-q8_0

[regex]
norm_prompt = configs/norm_prompt.txt
hard_prompt = configs/hard_prompt.txt

[watch_dog]
topics = topic-plugin-pub,topic-rag-qt
addr = tcp://localhost:50050